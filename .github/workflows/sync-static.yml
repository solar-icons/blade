name: Sync static catalog

# Prepares a release pull request. It never tags and never pushes to main:
# merging the pull request is the go-ahead (see tag-release.yml).
#
# The bump and the changelog text are not guessed from file diffs. They are
# read from what the maintainer declared in the changeset of
# @solar-icons/static (bin/plan-release.php). Version numbers stay
# independent per package; only the major has to match.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Explicit release instead of the upstream declaration (PHP-only fix, or an override)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'patch', 'minor']
      summary:
        description: 'Changelog text for an explicit release (required when "release" is not none)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run every check but push nothing and open no pull request'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-static
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Read the upstream state
        id: static
        shell: bash
        run: |
          PINNED=$(cat .static-version)
          LATEST=$(npm view @solar-icons/static version)
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [ "${LATEST}" != "${PINNED}" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      # npm answers "published" a little before the tarball is downloadable
      # everywhere, so a 404 right after a release is retried.
      - name: Refresh icon catalog from static tarball
        if: steps.static.outputs.update == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.static.outputs.latest }}
        run: |
          rm -rf node_modules/@solar-icons/static
          mkdir -p node_modules/@solar-icons/static
          for attempt in 1 2 3 4 5; do
            if npm pack "@solar-icons/static@${LATEST}" --pack-destination /tmp; then break; fi
            echo "@solar-icons/static@${LATEST} is not downloadable yet (attempt ${attempt}/5)"
            sleep 30
          done
          if ! ls /tmp/solar-icons-static-*.tgz >/dev/null 2>&1; then
            echo "::error::Could not download @solar-icons/static@${LATEST} from npm."
            exit 1
          fi
          tar -xzf /tmp/solar-icons-static-*.tgz -C node_modules/@solar-icons/static --strip-components=1
          php vendor/bin/blade-icons-generate
          php bin/generate-enum.php
          echo "${LATEST}" > .static-version

      # Only the file counts are used here: the bump is decided by the next step.
      - name: Count icon file changes
        id: detect
        if: steps.static.outputs.update == 'true'
        shell: bash
        run: |
          git add -A -n > /dev/null 2>&1 || true
          php bin/detect-icon-changes.php >> "$GITHUB_OUTPUT"

      - name: Plan the release from the declared intent
        id: plan
        shell: bash
        env:
          PINNED: ${{ steps.static.outputs.pinned }}
          LATEST: ${{ steps.static.outputs.latest }}
          MANUAL_BUMP: ${{ inputs.release }}
          MANUAL_SUMMARY: ${{ inputs.summary }}
          ADDED: ${{ steps.detect.outputs.added }}
          MODIFIED: ${{ steps.detect.outputs.modified }}
          DELETED: ${{ steps.detect.outputs.deleted }}
        run: |
          php bin/plan-release.php \
            --pinned="${PINNED}" \
            --upto="${LATEST}" \
            --bump="${MANUAL_BUMP:-none}" \
            --summary="${MANUAL_SUMMARY}" \
            --added="${ADDED:-0}" \
            --modified="${MODIFIED:-0}" \
            --deleted="${DELETED:-0}" \
            --write > plan.out
          cat plan.out
          cat plan.out >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pull requests do not trigger the other workflows, so the
      # regenerated payload is verified here, before anything is proposed.
      - name: Verify the regenerated catalog
        if: steps.plan.outputs.release == 'true'
        run: vendor/bin/phpunit

      - name: Verify coding standards
        if: steps.plan.outputs.release == 'true'
        run: vendor/bin/pint --test

      - name: Propose the release
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C release/next
          git add CHANGELOG.md resources/svg/ src/SolarIcon.php .static-version package.json
          git commit -m "release: v${VERSION}"
          git push --force origin release/next

          {
            cat release-notes.md
            printf '\n---\nMerging this pull request tags v%s and publishes it to Packagist.\n' "${VERSION}"
          } > pr-body.md

          NUMBER=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "${NUMBER}" ]; then
            gh pr edit "${NUMBER}" --title "release: v${VERSION}" --body-file pr-body.md
          else
            gh pr create --base main --head release/next --title "release: v${VERSION}" --body-file pr-body.md
          fi

      - name: Dry run summary
        if: steps.plan.outputs.release == 'true' && inputs.dry_run
        run: |
          echo "Dry run: would propose v${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.bump }})."
          cat release-notes.md
